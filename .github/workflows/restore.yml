name: Restore archive
on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Full 40-character commit SHA from main history'
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create recovery PR
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/restore.py "$TARGET_COMMIT" --core-only
      - name: Trigger required validation for bot-created PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate.yml --ref "$(git branch --show-current)"
